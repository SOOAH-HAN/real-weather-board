<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>REAL WEATHER · No guess. Just data.</title>
<style>
:root{--ink:#252525;--mute:#566070;--sun:#FFD95A;--sky:#BFDFFF;--cloud:#E3E9F2;--rain:#B9D4F5;--lav:#D9D0F2;--err:#FFB8B8;--blue:#1b4fc4;
--shadow:0 10px 30px rgba(60,90,140,.09);
--sans:"Pretendard Variable","Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#FBFCFF 0%,#EDF4FD 100%);background-attachment:fixed;color:var(--ink);font:16px/1.6 var(--sans)}
main{max-width:720px;margin:0 auto;padding:36px 20px 72px;display:grid;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.logo{font-size:clamp(1.8rem,7vw,2.4rem);font-weight:400;letter-spacing:.02em;line-height:1.1}
.tag{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.03em}
.hero{position:relative;overflow:hidden;background:#fff;border-radius:40px;padding:22px 28px 32px;box-shadow:var(--shadow);--glow:#FFE9A3}
.hero.stale{--glow:#E3E9F2}.hero.fail{--glow:#D3DDEC}
.hero::before{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,rgba(255,255,255,0) 70%)}
.hero>*{position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.pill{background:var(--sky);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;letter-spacing:.04em}
.hero.stale .pill{background:var(--cloud)}.hero.fail .pill{background:var(--err)}
.hbody{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-top:10px}
#mascot svg{width:176px;height:176px;display:block;filter:drop-shadow(0 12px 14px rgba(40,60,100,.18))}
.temp{font-size:clamp(3.8rem,13vw,6.2rem);font-weight:700;line-height:1;letter-spacing:-.05em}
.temp small{font-size:.36em;letter-spacing:0;margin-left:4px;font-weight:600}
.lab{font-size:12.5px;font-weight:700;letter-spacing:.14em;margin-top:10px;color:var(--mute)}
.sub{margin:10px 0 0;font-weight:600}
.msg{margin:14px 0 0;font-weight:700}
button.act{font:700 15px var(--sans);margin-top:16px;padding:12px 26px;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.card{background:#fff;border-radius:26px;padding:16px 20px;box-shadow:var(--shadow)}
.k{display:block;font-size:13.5px;font-weight:500;color:var(--mute)}
.card b{display:block;font-size:18px;font-weight:600;margin-top:2px;word-break:break-word}
.card a{color:var(--blue)}
.card.last{background:#F3F6FB;grid-column:1/-1}
.card.last b{font-size:30px}
.infog{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px 28px;padding:22px 26px}
.infog b{white-space:nowrap}
.infog em{font-style:normal;color:var(--mute);font-weight:500;font-size:14px;margin-left:5px}
.tag2{font-size:12.5px;font-weight:700}
h2{margin:14px 4px 0;font-size:17px;font-weight:500;letter-spacing:.02em}
.note{margin:0 4px;font-size:13px;color:var(--mute)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.cmp .card b{font-size:34px;letter-spacing:-.03em;font-weight:700}
.diff{background:var(--sun);border-radius:999px;padding:8px 16px;font-weight:800;text-align:center}
.rows{display:grid;gap:12px}
.row{background:#fff;border-radius:22px;padding:16px 20px;display:grid;gap:8px;box-shadow:var(--shadow)}
.rh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.rd{font-weight:700;color:var(--mute);font-size:14px}
.rt{display:flex;gap:4px 18px;flex-wrap:wrap;font-size:13.5px;color:var(--mute)}
.row .v{font-weight:800;font-size:26px;letter-spacing:-.02em}
.row .u{font:12px/1.5 var(--mono);color:var(--blue);word-break:break-all;text-decoration:none}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:14px}
.gal button{border:0;border-radius:28px;padding:16px 6px 18px;font:800 13px var(--sans);letter-spacing:.05em;color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.gal small{display:block;font-weight:500;letter-spacing:0;font-size:12.5px;margin-top:2px}
.gal svg{width:84px;height:84px;display:block;margin:0 auto 4px;filter:drop-shadow(0 8px 10px rgba(40,60,100,.16))}
.k-cloud{background:var(--cloud)}.k-rain{background:var(--rain)}.k-thunder{background:var(--lav)}
.rules{background:#fff;border-radius:26px;padding:18px 22px;font-size:14px;color:var(--mute);box-shadow:var(--shadow)}
.rules b{color:var(--ink)}
.end{text-align:center;font-weight:600;font-size:1.15rem;line-height:1.3;margin-top:10px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.gal button{transition:transform .15s}.gal button:hover{transform:translateY(-4px)}}
@media (max-width:560px){.hbody{grid-template-columns:1fr;justify-items:center;text-align:center;gap:6px}.cmp{grid-template-columns:1fr}.hero{padding:20px 20px 28px}}
</style>
</head>
<body>
<main>
  <header>
    <div><div class="logo">REAL WEATHER</div><div class="tag">DAILY OBSERVATION · Asia/Seoul (KST) · No guess. Just data.</div></div>
    <div class="tag" id="head-time">조회 대기 중</div>
  </header>
  <section class="hero" id="now" aria-live="polite"><p class="sub">불러오는 중…</p></section>
  <div id="info"></div>

  <h2>어제와 비교</h2>
  <div id="cmp"></div>

  <h2>저장된 기록</h2>
  <div class="rows" id="rec"></div>

  <h2>데이터가 안 올 때</h2>
  <p class="note">누르면 합성 시험값으로 재생해요. 실제 기록은 바뀌지 않아요.</p>
  <div class="gal" id="gal"></div>

  <div class="end">No guess.<br>Just data.</div>
</main>

<script>
const LAT = 36.3504, LON = 127.3845, PLACE = "DAEJEON · KOREA", TZ = "Asia/Seoul";
const API = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
  "&current=temperature_2m&timezone=" + TZ;
const RECORDS_URL = "data/real/weather-records.json";
const FRESH_MS = 60 * 60 * 1000, TIMEOUT_MS = 10000;
const MSG = {
  SLOW:["SLOW","응답이 10초 이상 지연되고 있습니다.","다시 시도"],
  DENIED:["DENIED","외부 데이터 제공처가 요청을 거부했습니다. (HTTP 401/403)","다시 시도"],
  RATE:["RATE LIMIT","요청 횟수 제한에 도달했습니다. 잠시 뒤에 다시 시도하세요.","잠시 뒤 다시 시도"],
  OFFLINE:["OFFLINE","인터넷 연결을 확인할 수 없습니다.","연결 후 다시 시도"],
  FORMAT:["FORMAT","데이터 형식이 예상과 다릅니다. 새 값은 표시하지 않습니다.","다시 시도"],
  HTTP:["ERROR","외부 데이터 제공처에서 오류가 났습니다.","다시 시도"]
};
const REPLAY = {slow:"SLOW", denied:"DENIED", rate:"RATE", offline:"OFFLINE", format:"FORMAT"};
let replay = REPLAY[new URLSearchParams(location.search).get("replay")] || null;
let records = null, recordsError = false, freshTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kst = d => new Intl.DateTimeFormat("sv-SE", {timeZone: TZ, year:"numeric", month:"2-digit",
  day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false}).format(d);
const obs = s => String(s).replace("T", " ");
class Fail extends Error { constructor(code, http){ super(code); this.code = code; this.http = http; } }

/* ---- 캐릭터: 날씨가 아니라 데이터 상태를 표현 ---- */
const KIND = {FRESH:"sun", STALE:"cloud", SLOW:"cloud", RATE:"cloud", OFFLINE:"rain", DENIED:"thunder", FORMAT:"thunder", HTTP:"thunder"};
const MARK = {STALE:"z", SLOW:"…", RATE:"‖", FORMAT:"?"};
const FILL = {cloud:"#E3E9F2", rain:"#B9D4F5", thunder:"#D9D0F2"};
function mascot(code) {
  const kind = KIND[code] || "thunder", I = "#252525";
  const ln = (a, w) => '<path d="' + a + '" fill="none" stroke="' + I + '" stroke-width="' + (w || 3.5) + '" stroke-linecap="round" stroke-linejoin="round"/>';
  const dot = (x, y, r, f) => '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + (f || I) + '"/>';
  let s = '';
  if (kind === "sun") {
    let sc = "";
    for (let i = 0; i < 12; i++) { const t = i * Math.PI / 6;
      sc += '<circle cx="' + (60 + 29 * Math.cos(t)).toFixed(1) + '" cy="' + (56 + 29 * Math.sin(t)).toFixed(1) + '" r="9"/>'; }
    sc += '<circle cx="60" cy="56" r="30"/>';
    const hand = (x, y) => '<circle cx="' + x + '" cy="' + y + '" r="4.5" fill="#FFD95A" stroke="' + I + '" stroke-width="2.5"/>';
    const star = (x, y, r) => '<path d="M' + x + ' ' + (y - r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + 'Q' + x + ' ' + y + ' ' + x + ' ' + (y + r) +
      'Q' + x + ' ' + y + ' ' + (x - r) + ' ' + y + 'Q' + x + ' ' + y + ' ' + x + ' ' + (y - r) + 'z" fill="#fff" stroke="' + I + '" stroke-width="2" stroke-linejoin="round"/>';
    s += ln("M22 62L12 54") + hand(11, 53) + ln("M98 62L108 54") + hand(109, 53) +
      ln("M50 93V105") + ln("M70 93V105") + ln("M44 106h12") + ln("M64 106h12") +
      '<g fill="' + I + '" stroke="' + I + '" stroke-width="7" stroke-linejoin="round">' + sc + '</g><g fill="#FFD95A">' + sc + '</g>' +
      '<ellipse cx="46" cy="40" rx="10" ry="5" fill="#FFF0A8" transform="rotate(-30 46 40)"/>' +
      ln("M41 54q6-8 12 0", 3.5) + ln("M67 54q6-8 12 0", 3.5) +
      dot(39, 64, 6, "#FFB3B3") + dot(81, 64, 6, "#FFB3B3") +
      '<path d="M53 63q7 11 14 0z" fill="' + I + '" stroke="' + I + '" stroke-width="2" stroke-linejoin="round"/>' +
      star(18, 22, 8) + star(103, 16, 6) + star(106, 92, 5);
  } else {
    const sh = '<rect x="22" y="48" width="76" height="40" rx="20"/><circle cx="46" cy="50" r="17"/><circle cx="72" cy="44" r="21"/>';
    const arms = kind === "thunder" ? ln("M30 68L20 78L34 82") + ln("M90 68L100 78L86 82") : ln("M26 70L14 86") + ln("M94 70L106 86");
    s += arms + ln("M50 88V102") + ln("M70 88V102") + ln("M44 103h12") + ln("M64 103h12") +
      '<g fill="' + I + '" stroke="' + I + '" stroke-width="7" stroke-linejoin="round">' + sh + '</g><g fill="' + FILL[kind] + '">' + sh + '</g>';
    if (kind === "cloud") s += ln("M43 64q5 4 10 0", 3) + ln("M67 64q5 4 10 0", 3) + ln("M56 76h8", 3);
    if (kind === "rain") s += dot(48, 64, 3.6) + dot(72, 64, 3.6) + dot(48, 71, 2.4, "#6FA3E6") + dot(72, 71, 2.4, "#6FA3E6") + ln("M52 79q8-6 16 0", 3) +
      ln("M106 86V66") + '<path d="M94 66q12-17 24 0z" fill="#FFD95A" stroke="' + I + '" stroke-width="3" stroke-linejoin="round"/>' +
      dot(36, 108, 2.6, "#6FA3E6") + dot(60, 111, 2.6, "#6FA3E6") + dot(84, 108, 2.6, "#6FA3E6");
    if (kind === "thunder") s += ln("M41 57L54 62", 3) + ln("M79 57L66 62", 3) + dot(48, 66, 3.2) + dot(72, 66, 3.2) +
      dot(40, 74, 4.5, "#FFB8B8") + dot(80, 74, 4.5, "#FFB8B8") + ln("M52 79q8-5 16 0", 3) +
      '<path d="M96 14L84 34H93L86 52L106 28H96L103 14z" fill="#FFD95A" stroke="' + I + '" stroke-width="2.5" stroke-linejoin="round"/>';
  }
  if (MARK[code]) s += '<text x="20" y="28" font-size="22" font-weight="800" fill="' + I + '" text-anchor="middle" font-family="monospace">' + MARK[code] + '</text>';
  return '<svg viewBox="0 0 120 120" role="img" aria-label="상태 캐릭터: ' + code + '">' + s + '</svg>';
}

async function fetchLive() {
  if (!navigator.onLine) throw new Fail("OFFLINE");
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  let res;
  try { res = await fetch(API, {signal: ctl.signal, cache: "no-store"}); }
  catch (e) { throw new Fail(e.name === "AbortError" ? "SLOW" : "OFFLINE"); }
  finally { clearTimeout(t); }
  if (res.status === 401 || res.status === 403) throw new Fail("DENIED");
  if (res.status === 429) throw new Fail("RATE");
  if (!res.ok) throw new Fail("HTTP", res.status);
  let d;
  try { d = await res.json(); } catch (e) { throw new Fail("FORMAT"); }
  const c = d && d.current, u = d && d.current_units;
  if (!c || typeof c.temperature_2m !== "number" || typeof c.time !== "string" ||
      !u || typeof u.temperature_2m !== "string") throw new Fail("FORMAT");
  return {temperature: c.temperature_2m, unit: u.temperature_2m, observed_at: c.time,
          fetched_at: new Date().toISOString(), source_url: API};
}

function saveLast(r) { try { localStorage.setItem("rw_last", JSON.stringify(r)); } catch (e) {} }
function lastNormal() {
  if (replay) return {temperature: 18.4, unit: "°C", observed_at: "2026-10-02T17:00", synthetic: true};
  try { const s = JSON.parse(localStorage.getItem("rw_last")); if (s && typeof s.temperature === "number") return s; } catch (e) {}
  if (records && records.length) return records[records.length - 1];
  return null;
}

function checkStale(live) {
  if (Date.now() - new Date(live.fetched_at).getTime() >= FRESH_MS) {
    $("#now").className = "hero stale"; $("#badge").textContent = "● STALE";
    $("#mascot").innerHTML = mascot("STALE"); $("#note-s").textContent = "1시간이 지났어요. 새로 확인이 필요해요";
    clearInterval(freshTimer);
  }
}

function renderNow(live, fail) {
  const el = $("#now"), info = $("#info");
  clearInterval(freshTimer);
  const top = pill => '<div class="top"><span>' + PLACE + '</span><span class="pill" id="badge">' + pill + '</span></div>';
  if (live) {
    el.className = "hero fresh";
    $("#head-time").textContent = "조회 " + kst(new Date(live.fetched_at)) + " KST";
    el.innerHTML = top("● FRESH") + '<div class="hbody"><div id="mascot">' + mascot("FRESH") + '</div><div class="htxt">' +
      '<div class="temp">' + esc(live.temperature.toFixed(1)) + '<small>' + esc(live.unit) + '</small></div>' +
      '<div class="lab">CURRENT TEMPERATURE</div><p class="sub" id="note-s">정상적으로 확인했어요</p></div></div>';
    freshTimer = setInterval(() => checkStale(live), 30000);
    const it = (k, v) => '<div><span class="k">' + k + '</span><b>' + v + '</b></div>';
    info.innerHTML = '<div class="card infog">' +
      it("원천 시각", esc(obs(live.observed_at)) + '<em>KST</em>') +
      it("조회 시각", kst(new Date(live.fetched_at)) + '<em>KST</em>') +
      it("출처", '<a href="https://open-meteo.com/" rel="noopener">Open-Meteo</a>') +
      it("기준 시간대", TZ) + '</div>';
    return;
  }
  const m = MSG[fail.code], last = lastNormal(), http = fail.http ? " (HTTP " + fail.http + ")" : "";
  el.className = "hero fail";
  $("#head-time").textContent = "조회 실패";
  el.innerHTML = top("● " + m[0]) + '<div class="hbody"><div id="mascot">' + mascot(fail.code) + '</div><div class="htxt">' +
    '<div class="temp">—</div><div class="lab">CURRENT TEMPERATURE</div>' +
    '<p class="msg">' + m[1] + http + '</p><button type="button" class="act" id="retry">' + m[2] + '</button></div></div>';
  $("#retry").onclick = () => { replay = null; load(); };
  info.innerHTML = last
    ? '<div class="card last"><span class="k">마지막 정상값 · STALE (현재 값이 아니에요)</span><b>' + esc(Number(last.temperature).toFixed(1)) + esc(last.unit) +
      '</b><span class="k">원천 시각 ' + esc(obs(last.observed_at)) + ' KST</span>' + (last.synthetic ? '<span class="tag2">SYNTHETIC TEST VALUE · 실제 기록 아님</span>' : '') + '</div>'
    : '<div class="card last"><span class="k">마지막 정상값이 없어요. 값을 만들어 보여 주지 않아요.</span></div>';
}

function renderCmp() {
  const el = $("#cmp"), say = (a, b) => { el.innerHTML = '<div class="card"><b>' + a + '</b><span class="k">' + b + '</span></div>'; };
  if (recordsError) return say("기록 파일을 읽지 못했어요", "비교값을 표시하지 않습니다.");
  if (!records.length) return say("아직 저장된 실제 기록이 없어요", "실제 조회 값을 파일에 저장하면 여기에 나타납니다.");
  if (records.length === 1) return say("비교할 어제 기록이 아직 없어요", "다음 실제 날짜에 다시 조회해서 기록합니다.");
  const a = records[records.length - 2], b = records[records.length - 1];
  const d = Math.round((b.temperature - a.temperature) * 10) / 10;
  const word = d > 0 ? "더 따뜻해요" : d < 0 ? "더 쌀쌀해요" : "같아요";
  el.innerHTML = '<div class="cmp"><div class="card"><span class="k">YESTERDAY · ' + esc(a.date) + '</span><b>' + a.temperature.toFixed(1) + '°</b></div>' +
    '<div class="diff">' + (d > 0 ? "+" : "") + d.toFixed(1) + '°<br>' + word + '</div>' +
    '<div class="card"><span class="k">TODAY · ' + esc(b.date) + '</span><b>' + b.temperature.toFixed(1) + '°</b></div></div>' +
    '<p class="note">변화 = 오늘 − 어제 = ' + b.temperature.toFixed(1) + ' − ' + a.temperature.toFixed(1) + ' (저장된 두 기록에서 계산)</p>';
}

function renderRecords() {
  const el = $("#rec");
  if (recordsError || !records.length) { el.innerHTML = '<div class="row"><span class="k">표시할 저장 기록이 없어요.</span></div>'; return; }
  el.innerHTML = records.slice().reverse().map(r =>
    '<div class="row"><div class="rh"><span class="rd">' + esc(r.date) + '</span><span class="v">' + esc(r.temperature) + esc(r.unit) + '</span></div>' +
    '<div class="rt"><span>관측 ' + esc(obs(r.observed_at)) + ' KST</span><span>조회 ' + esc(obs(r.fetched_at)) + ' KST</span></div>' +
    (/^https:\/\//.test(r.source_url) ? '<a class="u" href="' + esc(r.source_url) + '" target="_blank" rel="noopener">' + esc(r.source_url) + '</a>' : '<span class="u">' + esc(r.source_url) + '</span>') +
    '</div>').join("");
}

async function loadRecords() {
  try {
    const res = await fetch(RECORDS_URL, {cache: "no-store"});
    if (!res.ok) throw new Error();
    const j = await res.json();
    if (!j || !Array.isArray(j.records)) throw new Error();
    records = j.records.slice().sort((x, y) => x.date < y.date ? -1 : 1);
  } catch (e) { recordsError = true; records = []; }
  renderCmp(); renderRecords();
}

async function load() {
  $("#now").className = "hero"; $("#now").innerHTML = '<p class="sub">불러오는 중…</p>';
  try {
    if (replay) throw new Fail(replay);
    const live = await fetchLive();
    saveLast(live);
    renderNow(live, null);
  } catch (e) { renderNow(null, e instanceof Fail ? e : new Fail("FORMAT")); }
}

const GAL = [["SLOW","응답이 늦어요"],["RATE","요청 제한에 걸렸어요"],["OFFLINE","연결이 없어요"],["DENIED","요청이 거부됐어요"],["FORMAT","형식이 달라졌어요"]];
$("#gal").innerHTML = GAL.map(g => '<button type="button" class="k-' + KIND[g[0]] + '" data-c="' + g[0] + '">' + mascot(g[0]) + MSG[g[0]][0] + '<small>' + g[1] + '</small></button>').join("");
