<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>REAL WEATHER · No guess. Just data.</title>
<style>
:root{--ink:#1B2A4A;--mute:#4A5873;--blue:#2F6FED;--line:#E4ECF7;--sky:#E3EFFF;--lav:#EEE9FC;--mint:#DDF6EB;--sun:#FFF3D6;
--shadow:0 12px 32px rgba(50,90,160,.09);--sans:"Pretendard Variable","Pretendard","Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#F7FAFF 0%,#E9F2FE 100%);background-attachment:fixed;color:var(--ink);font:16px/1.55 var(--sans)}
main{max-width:980px;margin:0 auto;padding:28px 20px 64px;display:grid;gap:20px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px}
h1{margin:0;font-size:clamp(1.5rem,5vw,2rem);font-weight:800;letter-spacing:.01em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1.1fr auto minmax(250px,.95fr);gap:22px;align-items:center;padding:30px;border-radius:32px;background:linear-gradient(135deg,#DCEBFF 0%,#F3F8FF 62%,#E8F1FF 100%);box-shadow:var(--shadow)}
.hero.fail{background:linear-gradient(135deg,#E3E8F2 0%,#F4F6FA 70%)}
.pill{display:inline-block;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700}
.p-FRESH{background:#D3F5E6;color:#0B6E49}.p-SLOW{background:#DAE7FA;color:#24498A}.p-RATE,.p-FORMAT,.p-HTTP{background:#E6DEFA;color:#55379F}
.p-OFFLINE{background:#E0E5ED;color:#38465F}.p-DENIED{background:#FFD8D8;color:#9B2626}
.lead{margin:14px 0 0;font-size:1.15rem;font-weight:600}
.temp{font-size:clamp(3.8rem,12vw,5.6rem);font-weight:800;line-height:1.05;letter-spacing:-.04em}
.temp small{font-size:.4em;font-weight:700;letter-spacing:0;margin-left:2px}
.cond{display:flex;align-items:center;gap:10px;margin:6px 0 0;font-weight:700;flex-wrap:wrap}
.cond span{font-weight:500;color:var(--mute);border-left:1px solid #B8C6DD;padding-left:10px}
.msg{margin:8px 0 0;font-weight:700}
.st{margin:10px 0 0;font:600 12.5px ui-monospace,Consolas,monospace;color:var(--mute)}
.tag2{margin:6px 0 0;font-size:12.5px;font-weight:700;color:#8A5A00}
#mascot svg{width:210px;height:210px;display:block;filter:drop-shadow(0 14px 16px rgba(40,70,130,.16))}
.side{background:rgba(255,255,255,.92);border-radius:22px;padding:8px 20px}
.ir{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.ir:last-child{border:0}.ir span{color:var(--mute)}.ir b{font-weight:600}.ir svg{color:var(--blue)}
.side a,.panel a{color:var(--blue)}
.last{padding:14px 0}.last .k{display:block;font-size:13px;color:var(--mute)}.last b{display:block;font-size:30px;margin:2px 0}
button.act{font:700 15px var(--sans);margin-top:16px;padding:12px 26px;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.panel{background:#fff;border-radius:28px;padding:22px 24px;box-shadow:var(--shadow)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h2{margin:0;font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:10px}
h2 svg{color:var(--blue)}
.ph .n{font-size:13px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.tile svg{width:30px;height:30px;grid-row:span 2}
.tile .k{font-size:13.5px;color:var(--mute)}
.tile b{font-size:1.65rem;font-weight:700;line-height:1.2}.tile b small{font-size:.55em;margin-left:2px;font-weight:600}
.t1{background:var(--sky)}.t1 svg{color:#2F6FED}.t2{background:var(--lav)}.t2 svg{color:#6B4DD8}
.t3{background:var(--mint)}.t3 svg{color:#139A66}.t4{background:var(--sun)}.t4 svg{color:#E09A00}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.cb{border-radius:22px;padding:18px 24px}.cb.y{background:var(--sky)}.cb.t{background:var(--lav)}
.cb .k{font-weight:700;font-size:14px}.cb .d{font-size:13px;color:var(--mute)}.cb b{display:block;font-size:2.3rem;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.diff{width:116px;height:116px;border-radius:50%;background:#E8F0FF;color:var(--blue);display:grid;place-content:center;text-align:center;font-weight:800;font-size:1.35rem;line-height:1.2}
.diff small{display:block;font-size:12.5px;font-weight:600;color:var(--mute)}
.note{margin:12px 2px 0;font-size:13px;color:var(--mute)}
.rows{display:grid;gap:12px}
.row{display:grid;grid-template-columns:minmax(190px,1.3fr) repeat(4,minmax(80px,1fr));gap:10px 16px;align-items:center;background:#F7FAFE;border:1px solid var(--line);border-radius:18px;padding:14px 20px}
.row .main b{font-size:1.25rem;font-weight:700;margin-right:8px}
.row .dt{font-size:14px;font-weight:600}.row .dt span{color:var(--mute);font-weight:500;margin-left:6px}
.row .k{display:block;font-size:12.5px;color:var(--mute)}.row .v{font-size:13.5px;font-weight:600}
.badge{display:inline-block;margin-left:8px;border-radius:999px;background:#E2E9F5;color:#34476B;font-size:11.5px;font-weight:700;padding:2px 10px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.gal button{border:0;border-radius:22px;padding:14px 6px 16px;font:700 13.5px var(--sans);color:var(--ink);cursor:pointer}
.gal small{display:block;font-weight:500;font-size:12.5px;margin-top:2px}
.gal svg{width:84px;height:84px;display:block;margin:0 auto 4px}
.k-SLOW{background:#E6F0FF}.k-RATE{background:#EFEAFD}.k-OFFLINE{background:#EBEDF1}.k-DENIED{background:#FFEBEB}.k-FORMAT{background:#EFEAFD}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--mute)}
.foot .info{display:flex;align-items:center;gap:10px;background:#EAF2FF;border-radius:14px;padding:12px 16px;max-width:430px}
.foot .info svg{color:var(--blue)}
.sig{font:600 1.6rem/1.2 "Nanum Pen Script","Segoe Script","Brush Script MT",cursive;font-style:italic;color:var(--blue)}
.test b{font-size:16px}.test p{margin:4px 0 0;font-size:14px;color:var(--mute)}
.test button.act{margin-top:12px;padding:9px 20px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.gal button{transition:transform .15s}.gal button:hover{transform:translateY(-4px)}}
@media (max-width:860px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .side{width:100%;text-align:left}.cond{justify-content:center}}
@media (max-width:720px){.cmp{grid-template-columns:1fr;justify-items:stretch}.diff{margin:0 auto}.row{grid-template-columns:1fr 1fr}.row .main{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 120 120" aria-hidden="true"><g fill="#2B3A67" stroke="#2B3A67" stroke-width="6" stroke-linejoin="round"><rect x="20" y="50" width="80" height="42" rx="21"/><circle cx="46" cy="54" r="19"/><circle cx="74" cy="48" r="22"/></g><g fill="#DCEBFF"><rect x="20" y="50" width="80" height="42" rx="21"/><circle cx="46" cy="54" r="19"/><circle cx="74" cy="48" r="22"/></g></svg>
      <div><h1>REAL WEATHER</h1><p>No guess. Just data.</p></div>
    </div>
    <div class="chips"><div class="chip" id="ic-pin"></div><div class="chip" id="head-time">조회 대기 중</div></div>
  </header>

  <section class="hero" id="now" aria-live="polite"><p class="lead">불러오는 중…</p></section>
  <div id="test"></div>

  <section class="panel">
    <div class="ph"><h2 id="h-today"></h2><a href="https://open-meteo.com/" rel="noopener">출처 보기</a></div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="panel">
    <div class="ph"><h2 id="h-cmp"></h2><span class="n">기준 시간대 : Asia/Seoul</span></div>
    <div id="cmp"></div>
  </section>

  <section class="panel">
    <div class="ph"><h2 id="h-rec"></h2></div>
    <div class="rows" id="rec"></div>
  </section>

  <section class="panel">
    <div class="ph"><h2 id="h-gal"></h2><span class="n">누르면 공개 합성 fixture(test-data/fixtures)를 재생해요. 실제 기록은 바뀌지 않아요.</span></div>
    <div class="gal" id="gal"></div>
    <div class="foot">
      <div class="info" id="legend"></div>
      <span>출처 Open-Meteo · 시간대 Asia/Seoul</span>
      <span class="sig">No guess. Just data.</span>
    </div>
  </section>
</main>

<script>
const LAT = 36.3504, LON = 127.3845, TZ = "Asia/Seoul";
const API = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
  "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=sunrise,sunset&wind_speed_unit=ms&forecast_days=1&timezone=" + TZ;
const RECORDS_URL = "data/real/weather-records.json";
const TIMEOUT_MS = 10000;
const MSG = {
  SLOW:["SLOW","응답이 10초 이상 지연되고 있습니다.","다시 시도"],
  DENIED:["DENIED","외부 데이터 제공처가 요청을 거부했습니다. (HTTP 401/403)","다시 시도"],
  RATE:["RATE LIMIT","요청 횟수 제한에 도달했습니다. 잠시 뒤에 다시 시도하세요.","잠시 뒤 다시 시도"],
  OFFLINE:["OFFLINE","인터넷 연결을 확인할 수 없습니다.","연결 후 다시 시도"],
  FORMAT:["FORMAT","데이터 형식이 예상과 다릅니다. 새 값은 표시하지 않습니다.","다시 시도"],
  HTTP:["ERROR","외부 데이터 제공처에서 오류가 났습니다.","다시 시도"]
};
const REPLAY = {slow:"SLOW", denied:"DENIED", rate:"RATE", offline:"OFFLINE", format:"FORMAT"};
let replay = REPLAY[new URLSearchParams(location.search).get("replay")] || null;
let ev = null, records = null, recordsError = false;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kst = d => new Intl.DateTimeFormat("sv-SE", {timeZone: TZ, year:"numeric", month:"2-digit",
  day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false}).format(d);
const dot = s => String(s).replace("T", " ").replace(/-/g, ".");   // 2026-10-07T16:55 → 2026.10.07 16:55
const srcT = s => s ? kst(new Date(s)) : "—";                      // 합성 fixture의 UTC 시각 → KST 표기
const okst = s => s && s !== "—" ? dot(s) + " KST" : "—";
class Fail extends Error { constructor(code, http){ super(code); this.code = code; this.http = http; } }

/* ---- 아이콘 ---- */
const IC = {
  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  therm:'<path d="M10 14V5a2 2 0 014 0v9a4 4 0 11-4 0z"/>',
  drop:'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>',
  wind:'<path d="M3 9h11a3 3 0 10-3-3M3 14h15a3 3 0 11-3 3M3 19h6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  cloud:'<path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18z"/>',
  chart:'<path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/>',
  save:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
  spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>'
};
const ic = n => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + '</svg>';
const WX = c => c == null ? null : c === 0 ? "맑음" : c <= 2 ? "구름 조금" : c === 3 ? "흐림" : c <= 48 ? "안개" : c <= 57 ? "이슬비" : c <= 67 ? "비" : c <= 77 ? "눈" : c <= 82 ? "소나기" : c <= 86 ? "눈 소나기" : "뇌우";

/* ---- 캐릭터: 날씨가 아니라 데이터 상태를 표현 ---- */
function mascot(code) {
  const I = "#2B3A67", P = {FRESH:"#FFFFFF", SLOW:"#EAF2FF", RATE:"#F1ECFF", OFFLINE:"#EDEFF3", DENIED:"#FFECEC", FORMAT:"#F1ECFF", HTTP:"#F1ECFF"};
  const ln = (d, w) => '<path d="' + d + '" fill="none" stroke="' + I + '" stroke-width="' + (w || 3) + '" stroke-linecap="round" stroke-linejoin="round"/>';
  const dt = (x, y, r, f) => '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + (f || I) + '"/>';
  const sh = '<rect x="20" y="50" width="80" height="42" rx="21"/><circle cx="46" cy="54" r="19"/><circle cx="74" cy="48" r="22"/>';
  const txt = (x, y, t, f, sz, a) => '<text x="' + x + '" y="' + y + '" font-size="' + sz + '" font-weight="800" fill="' + f + '" text-anchor="' + (a || "middle") + '" font-family="sans-serif">' + t + '</text>';
  let s = "";
  if (code === "FRESH") s += dt(88, 32, 25, "#FFD95A") + dt(80, 24, 8, "#FFF0A8") + ln("M88 -2v5") + ln("M112 8l-4 4") + ln("M118 32h-5");
  s += ln("M50 92v10") + ln("M70 92v10") + ln("M45 102h10") + ln("M65 102h10");
  s += '<g fill="' + I + '" stroke="' + I + '" stroke-width="6" stroke-linejoin="round">' + sh + '</g><g fill="' + (P[code] || "#fff") + '">' + sh + '</g>';
  if (code === "SLOW") s += ln("M42 67q5 4 10 0") + ln("M68 67q5 4 10 0") + ln("M56 78h8");
  else if (code === "DENIED") s += dt(47, 68, 3.4) + dt(73, 68, 3.4) + ln("M40 60l12 4") + ln("M80 60l-12 4") + ln("M54 80q6-5 12 0");
  else if (code === "OFFLINE") s += dt(47, 67, 3.4) + dt(73, 67, 3.4) + ln("M54 80q6-5 12 0");
  else s += dt(47, 67, 3.4) + dt(73, 67, 3.4) + ln(code === "FRESH" ? "M53 76q7 7 14 0" : "M55 78q5 2 10 0");
  s += dt(37, 76, 5, "#FFB8C8") + dt(83, 76, 5, "#FFB8C8");
  if (code === "SLOW") s += txt(16, 30, "…", I, 24) + dt(99, 56, 4, "#6FA3E6");
  if (code === "RATE") s += '<path d="M96 76l14 24H82z" fill="#FFD95A" stroke="' + I + '" stroke-width="3" stroke-linejoin="round"/>' + ln("M96 85v6") + dt(96, 95, 1.7);
  if (code === "OFFLINE") s += ln("M84 88q12-10 24 0") + ln("M89 94q7-6 14 0") + dt(96, 99, 2) + '<path d="M82 106L110 76" stroke="#F25C5C" stroke-width="4" stroke-linecap="round"/>';
  if (code === "DENIED") s += dt(96, 92, 13, "#F25C5C") + '<path d="M90 86l12 12M102 86L90 98" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>';
  if (code === "FORMAT" || code === "HTTP") s += dt(96, 92, 13, "#7A5AF8") + txt(96, 99, "?", "#fff", 19);
  return '<svg viewBox="0 0 120 120" role="img" aria-label="상태 캐릭터: ' + code + '">' + s + '</svg>';
}

async function fetchLive() {
  if (!navigator.onLine) throw new Fail("OFFLINE");
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  let res;
  try { res = await fetch(API, {signal: ctl.signal, cache: "no-store"}); }
  catch (e) { throw new Fail(e.name === "AbortError" ? "SLOW" : "OFFLINE"); }
  finally { clearTimeout(t); }
  if (res.status === 401 || res.status === 403) throw new Fail("DENIED");
  if (res.status === 429) throw new Fail("RATE");
  if (!res.ok) throw new Fail("HTTP", res.status);
  let d;
  try { d = await res.json(); } catch (e) { throw new Fail("FORMAT"); }
  const c = d && d.current, u = d && d.current_units, dl = (d && d.daily) || {};
  if (!c || typeof c.temperature_2m !== "number" || typeof c.time !== "string" ||
      !u || typeof u.temperature_2m !== "string") throw new Fail("FORMAT");
  const n = x => typeof x === "number" ? x : null, first = a => Array.isArray(a) && typeof a[0] === "string" ? a[0] : null;
  return {temperature: c.temperature_2m, unit: u.temperature_2m, observed_at: c.time,
          fetched_at: new Date().toISOString(), source_url: API,
          hum: n(c.relative_humidity_2m), wind: n(c.wind_speed_10m), windUnit: u.wind_speed_10m || "m/s",
          code: n(c.weather_code), sunrise: first(dl.sunrise), sunset: first(dl.sunset)};
}

function saveLast(r) { try { localStorage.setItem("rw_last", JSON.stringify(r)); } catch (e) {} }
function lastNormal() {
  if (ev) { const c = ev.st.current; return c ? {temperature: c.normalized_value, unit: c.unit, observed_at: srcT(c.source_time), synthetic: true} : null; }
  try { const s = JSON.parse(localStorage.getItem("rw_last")); if (s && typeof s.temperature === "number") return s; } catch (e) {}
  if (records && records.length) return records[records.length - 1];
  return null;
}

/* ---- 공개 합성 fixture 재생 (adapter-reset.example.js와 같은 상태 전이) ---- */
const FXFILE = {SLOW:"timeout", DENIED:"auth-401", RATE:"rate-429", OFFLINE:"offline", FORMAT:"schema-break"};
const ERRMAP = {timeout:"SLOW", auth:"DENIED", rate_limit:"RATE", offline:"OFFLINE", schema_error:"FORMAT"};
const LIVECODE = {SLOW:"timeout", DENIED:"auth", RATE:"rate_limit", OFFLINE:"offline", FORMAT:"schema_error", HTTP:"schema_error"};
const FIELDS = ["signal_id","normalized_value","unit","source_name","source_url","source_time","fetched_at","record_timezone","record_date"];
const kstDate = iso => { const p = Object.fromEntries(new Intl.DateTimeFormat("en", {timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit"}).formatToParts(new Date(iso)).map(x => [x.type, x.value])); return p.year + "-" + p.month + "-" + p.day; };
function validateReading(r) {
  const bad = () => { throw new TypeError("invalid reading"); };
  if (!r || typeof r !== "object" || Array.isArray(r)) bad();
  if (Object.getOwnPropertyNames(r).sort().join() !== FIELDS.slice().sort().join()) bad();
  if (!/^[a-z0-9][a-z0-9._-]*$/.test(r.signal_id)) bad();
  if (typeof r.normalized_value !== "number" || !isFinite(r.normalized_value)) bad();
  for (const f of ["unit", "source_name"]) if (typeof r[f] !== "string" || !r[f].trim()) bad();
  let u; try { u = new URL(r.source_url); } catch (e) { bad(); }
  if (u.protocol !== "https:") bad();
  if (r.source_time !== null && isNaN(new Date(r.source_time))) bad();
  if (isNaN(new Date(r.fetched_at))) bad();
  if (r.record_timezone !== TZ) bad();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(r.record_date) || r.record_date !== kstDate(r.fetched_at)) bad();
}
const evReset = () => ({rows: [], current: null, status: null, delta: null});
function evApply(st, fx) {
  const s = JSON.parse(JSON.stringify(st)), t = fx.transport;
  const err = c => { s.status = {freshness: "stale", error_code: c}; return s; };
  if (t.mode === "timeout") return err("timeout");
  if (t.mode === "offline") return err("offline");
  if (t.status === 401 || t.status === 403) return err("auth");
  if (t.status === 429) return err("rate_limit");
  if (t.status >= 200 && t.status < 300) {
    try { validateReading(fx.payload); } catch (e) { return err("schema_error"); }
    const r = fx.payload, i = s.rows.findIndex(x => x.signal_id === r.signal_id && x.record_date === r.record_date);
    const row = {signal_id: r.signal_id, record_date: r.record_date, normalized_value: r.normalized_value, unit: r.unit};
    if (i >= 0) s.rows[i] = row; else s.rows.push(row);
    s.rows.sort((a, b) => a.record_date.localeCompare(b.record_date));
    const prev = s.rows.filter(x => x.record_date < r.record_date).pop();
    s.delta = prev && prev.unit === r.unit ? r.normalized_value - prev.normalized_value : null;
    s.current = JSON.parse(JSON.stringify(r)); s.status = {freshness: "fresh", error_code: "none"};
    return s;
  }
  return err("schema_error");
}
async function fxLoad(name) {
  const r = await fetch("test-data/fixtures/" + name + ".json", {cache: "no-store"});
  if (!r.ok) throw new Error("fixture"); return r.json();
}
async function runReplay(code) {
  try {
    let st = evReset(); const steps = [];
    for (const n of ["normal-d1-a", "normal-d1-b", FXFILE[code]]) { const f = await fxLoad(n); st = evApply(st, f); steps.push(f.fixture_id); }
    ev = {st, steps}; showReplay();
  } catch (e) { $("#test").innerHTML = '<div class="panel test"><b>시험 파일을 읽지 못했어요</b><p>test-data/fixtures 폴더가 저장소에 있는지 확인해 주세요.</p></div>'; }
}
async function recoverReplay() {
  try { const f = await fxLoad("recover-d2"); ev.st = evApply(ev.st, f); ev.steps.push(f.fixture_id); showReplay(); }
  catch (e) { $("#test").innerHTML = '<div class="panel test"><b>시험 파일을 읽지 못했어요</b></div>'; }
}
function showReplay() {
  const st = ev.st;
  if (st.status.freshness === "fresh") {
    renderNow({temperature: st.current.normalized_value, unit: st.current.unit, observed_at: srcT(st.current.source_time),
               fetched_at: st.current.fetched_at, synthetic: true}, null);
  } else renderNow(null, new Fail(ERRMAP[st.status.error_code]));
  const c = st.current, last = c ? c.normalized_value + " " + c.unit : "없음";
  $("#test").innerHTML = '<div class="panel test"><span class="n">합성 시험 재생 · 실제 기록과 분리</span>' +
    '<p><b>freshness: ' + st.status.freshness + ' · error_code: ' + st.status.error_code + '</b></p>' +
    '<p>재생 순서: reset → ' + ev.steps.join(" → ") + '</p>' +
    '<p>일별 기록 ' + st.rows.length + '건 · 저장값 ' + esc(last) + (st.delta !== null ? ' · 전일 대비 +' + st.delta : '') +
    ' · 마지막 날짜 ' + esc(st.rows[st.rows.length - 1].record_date) + '</p>' +
    '<button type="button" class="act" id="exitTest">실제 조회로 돌아가기</button></div>';
  $("#exitTest").onclick = () => load();
}

/* ---- 화면 그리기 ---- */
function renderTiles(live) {
  if (live && live.synthetic) live = null;   // 합성 시험값은 '오늘의 데이터'에 넣지 않음
  const v = (x, u) => x == null ? "—" : esc(x) + (u ? "<small>" + esc(u) + "</small>" : "");
  const hm = s => s ? s.slice(11, 16) : null;
  const sun = live && hm(live.sunrise) && hm(live.sunset) ? hm(live.sunrise) + " / " + hm(live.sunset) : null;
  const T = (c, i, k, val) => '<div class="tile ' + c + '">' + ic(i) + '<span class="k">' + k + '</span><b>' + val + '</b></div>';
  $("#tiles").innerHTML =
    T("t1", "therm", "기온", live ? v(live.temperature.toFixed(1), live.unit) : "—") +
    T("t2", "drop", "습도", live ? v(live.hum, "%") : "—") +
    T("t3", "wind", "풍속", live ? v(live.wind == null ? null : live.wind.toFixed(1), live.windUnit) : "—") +
    T("t4", "sun", "일출 / 일몰", sun ? esc(sun) : "—");
}

function renderNow(live, fail) {
  const el = $("#now");
  const row = (i, k, v) => '<div class="ir">' + ic(i) + '<span>' + k + '</span><b>' + v + '</b></div>';
  renderTiles(live);
  if (live) {
    el.className = "hero fresh";
    $("#head-time").innerHTML = ic("clock") + "KST " + kst(new Date(live.fetched_at)).replace(/-/g, ".");
    const wx = WX(live.code);
    el.innerHTML = '<div class="htxt"><span class="pill p-FRESH">● FRESH</span><p class="lead">지금 대전의 날씨는</p>' +
      '<div class="temp">' + esc(live.temperature.toFixed(1)) + '<small>' + esc(live.unit) + '</small></div>' +
      '<p class="cond">' + (wx ? ic(live.code <= 2 ? "sun" : "cloud") + wx + '<span>대전 · 대한민국</span>' : '대전 · 대한민국') + '</p>' +
      '<p class="st">freshness: fresh · error_code: none</p>' +
      (live.synthetic ? '<p class="tag2">SYNTHETIC TEST VALUE · 실제 기록 아님</p>' : '') + '</div>' +
      '<div id="mascot">' + mascot("FRESH") + '</div>' +
      '<div class="side">' +
        row("link", "출처", live.synthetic ? "ALEPH 결정론 replay" : '<a href="https://open-meteo.com/" rel="noopener">Open-Meteo</a>') +
        row("clock", "출처 시각", esc(okst(live.observed_at))) +
        row("clock", "조회 시각", kst(new Date(live.fetched_at)).replace(/-/g, ".") + " KST") +
        row("globe", "기준 시간대", TZ) + '</div>';
    return;
  }
  const m = MSG[fail.code], last = lastNormal(), http = fail.http ? " (HTTP " + fail.http + ")" : "";
  el.className = "hero fail";
  $("#head-time").innerHTML = ic("clock") + "조회 실패";
  el.innerHTML = '<div class="htxt"><span class="pill p-' + fail.code + '">● ' + m[0] + '</span><p class="lead">지금 대전의 날씨는</p>' +
    '<div class="temp">—</div><p class="msg">' + m[1] + http + '</p>' +
    '<p class="st">freshness: stale · error_code: ' + LIVECODE[fail.code] + '</p>' +
    '<button type="button" class="act" id="retry">' + m[2] + '</button></div>' +
    '<div id="mascot">' + mascot(fail.code) + '</div>' +
    '<div class="side">' + (last
      ? '<div class="last"><span class="k">마지막 정상값 · STALE (현재 값이 아니에요)</span><b>' + esc(Number(last.temperature).toFixed(1)) + esc(last.unit) +
        '</b><span class="k">원천 시각 ' + esc(okst(last.observed_at)) + '</span>' +
        (last.synthetic ? '<span class="tag2">SYNTHETIC TEST VALUE · 실제 기록 아님</span>' : '') + '</div>'
      : '<div class="last"><span class="k">마지막 정상값이 없어요. 값을 만들어 보여 주지 않아요.</span></div>') + '</div>';
  $("#retry").onclick = () => { if (ev) recoverReplay(); else load(); };
}

function renderCmp() {
  const el = $("#cmp"), say = (a, b) => { el.innerHTML = '<div class="cb y"><b style="font-size:1.1rem">' + a + '</b><span class="d">' + b + '</span></div>'; };
  if (recordsError) return say("기록 파일을 읽지 못했어요", "비교값을 표시하지 않습니다.");
  if (!records.length) return say("아직 저장된 실제 기록이 없어요", "실제 조회 값을 파일에 저장하면 여기에 나타납니다.");
  if (records.length === 1) return say("비교할 어제 기록이 아직 없어요", "다음 실제 날짜에 다시 조회해서 기록합니다.");
  const a = records[records.length - 2], b = records[records.length - 1];
  const d = Math.round((b.temperature - a.temperature) * 10) / 10;
  el.innerHTML = '<div class="cmp"><div class="cb y"><span class="k">YESTERDAY</span> <span class="d">' + esc(dot(a.date)) + '</span><b>' + a.temperature.toFixed(1) + esc(a.unit || "°C") + '</b></div>' +
    '<div class="diff"><span>' + (d > 0 ? "↑ +" : d < 0 ? "↓ " : "") + d.toFixed(1) + '°</span><small>어제 대비</small></div>' +
    '<div class="cb t"><span class="k">TODAY</span> <span class="d">' + esc(dot(b.date)) + '</span><b>' + b.temperature.toFixed(1) + esc(b.unit || "°C") + '</b></div></div>' +
    '<p class="note">변화 = 오늘 − 어제 = ' + b.temperature.toFixed(1) + ' − ' + a.temperature.toFixed(1) + ' (저장된 두 기록에서 계산)</p>';
}

function renderRecords() {
  const el = $("#rec");
  if (recordsError || !records.length) { el.innerHTML = '<div class="row"><span class="k">표시할 저장 기록이 없어요.</span></div>'; return; }
  const cell = (k, v) => '<div><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  el.innerHTML = records.slice().reverse().map(r => {
    const src = /^https:\/\//.test(r.source_url) ? '<a href="' + esc(r.source_url) + '" target="_blank" rel="noopener">Open-Meteo</a>' : "Open-Meteo";
    return '<div class="row"><div class="main"><span class="dt">' + esc(dot(r.date)) + '<span>' + esc(dot(r.fetched_at).slice(11, 16)) + '</span><i class="badge">SAVED</i></span>' +
      '<div><b>' + esc(Number(r.temperature).toFixed(1)) + esc(r.unit) + '</b></div></div>' +
      cell("출처", src) + cell("출처 시각", esc(dot(r.observed_at))) + cell("조회 시각", esc(dot(r.fetched_at))) + cell("단위", esc(r.unit)) + '</div>';
  }).join("");
}

async function loadRecords() {
  try {
    const res = await fetch(RECORDS_URL, {cache: "no-store"});
    if (!res.ok) throw new Error();
    const j = await res.json();
    if (!j || !Array.isArray(j.records)) throw new Error();
    records = j.records.slice().sort((x, y) => x.date < y.date ? -1 : 1);
  } catch (e) { recordsError = true; records = []; }
  renderCmp(); renderRecords();
}

async function load() {
  ev = null; $("#test").innerHTML = "";
  $("#now").className = "hero"; $("#now").innerHTML = '<p class="lead">불러오는 중…</p>';
  try { const live = await fetchLive(); saveLast(live); renderNow(live, null); }
  catch (e) { renderNow(null, e instanceof Fail ? e : new Fail("FORMAT")); }
}

/* ---- 정적 부분 채우기 ---- */
$("#ic-pin").innerHTML = ic("pin") + "DAEJEON · KOREA";
$("#h-today").innerHTML = ic("spark") + "오늘의 데이터";
$("#h-cmp").innerHTML = ic("chart") + "어제와 비교";
$("#h-rec").innerHTML = ic("save") + "저장된 기록";
$("#h-gal").innerHTML = ic("flask") + "데이터가 안 올 때";
$("#legend").innerHTML = ic("info") + '<span>FRESH / STALE / SLOW / RATE LIMIT / OFFLINE / DENIED / FORMAT<br>캐릭터는 날씨가 아니라 데이터 상태를 나타내요.</span>';
const GAL = [["SLOW","응답이 느려요"],["RATE","호출 제한이에요"],["OFFLINE","연결이 안 돼요"],["DENIED","접근이 거부됐어요"],["FORMAT","형식이 달라졌어요"]];
$("#gal").innerHTML = GAL.map(g => '<button type="button" class="k-' + g[0] + '" data-c="' + g[0] + '">' + mascot(g[0]) + MSG[g[0]][0] + '<small>' + g[1] + '</small></button>').join("");
$("#gal").onclick = e => { const b = e.target.closest("button"); if (!b) return; runReplay(b.dataset.c); window.scrollTo(0, 0); };
renderTiles(null);
loadRecords().then(() => replay ? runReplay(replay) : load());
</script>
